  <style>
    :root {
      --bg:        #f7f7f5;
      --surface:   #ffffff;
      --ink:       #2b2b2b;
      --ink-mid:   #4a4a4a;

      --ink-light: #7f8088;
      --rule:      #34353c;
      --accent:    #82aaff;
      --accent-dk: #a5c2ff;

    /* ===== Top nav ===== */
    .topnav {
      max-width: 1180px;
      margin: 30px auto 0;
      padding: 16px 40px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      transition: background-color 0.4s ease;
    }
<!-- ... existing code ... -->
    .icon-sun { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* ===== Layout ===== */
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 40px 80px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 64px;
      align-items: start;
    }

    .section { margin-bottom: 44px; scroll-margin-top: 70px; }
<!-- ... existing code ... -->
    /* ===== Sidebar ===== */
    .sidebar { position: sticky; top: 74px; }
    .side-block { margin-bottom: 38px; }
    .side-head {
      font-family: var(--serif);
      font-weight: 600; font-size: 1.2rem; color: var(--ink);
      margin-bottom: 16px;
    }
    .side-photo {
      width: 175px; height: 175px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--rule);
      background: var(--surface); margin-bottom: 16px;
      filter: grayscale(6%); display: block;
    }
    .side-photo-fallback {
      width: 175px; height: 175px; border-radius: 8px;
      border: 1px solid var(--rule);
      background: linear-gradient(160deg, #cfd3ef, #e8c9d8);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; color: #fff; font-weight: 600; margin-bottom: 16px;
    }
    .side-name { font-family: var(--serif); font-size: 1.1rem; color: var(--accent); font-weight: 500; }
